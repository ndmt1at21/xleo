name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      # -short skips TestPerfTarget; perf gating is intentionally local-only
      # because CI runners (2 vCPU, shared) aren't a stable perf baseline.
      - run: go test -race -short ./...
